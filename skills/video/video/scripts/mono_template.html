    <style>

      @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }

      @font-face { font-family: "Unbounded"; font-weight: 800; src: url("assets/fonts/unbounded-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url("assets/fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      :root { --ink: #070a1a; --white: #f4f7ff; --cyan: #22e6ff; --violet: #8b5cf6; --gold: #ffc83d; --coral: #ff5d8f; --line: #120a1c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      body { font-family: "Inter", sans-serif; color: var(--white); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      .abs { position: absolute; }

      /* ---------- scene 1 · space ---------- */
      #s1 { background: radial-gradient(ellipse 90% 60% at 50% 30%, rgba(13, 20, 64, 0.55) 0%, rgba(5, 6, 15, 0.25) 60%, transparent 100%); }
      #s1-planet { position: absolute; left: -260px; top: 1180px; width: 1600px; height: 1600px; }
      #s1-glow { position: absolute; left: -200px; top: 1040px; width: 1480px; height: 500px; border-radius: 50%;

      .star { position: absolute; border-radius: 50%; background: #fff; }
      #shoot { position: absolute; left: 0; top: 0; width: 260px; height: 4px; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #fff); }

      /* ---------- scene 2 · workshop ---------- */

      #s2-floor { position: absolute; left: -540px; right: -540px; top: 1260px; height: 900px; transform-origin: 50% 0; transform: perspective(700px) rotateX(62deg);
        background-image: linear-gradient(rgba(94, 234, 212, 0.35) 2px, transparent 2px), linear-gradient(90deg, rgba(94, 234, 212, 0.35) 2px, transparent 2px);
        background-size: 120px 120px; }
      #s2-horizon { position: absolute; left: 0; right: 0; top: 1150px; height: 220px; background: radial-gradient(ellipse at 50% 100%, rgba(94, 234, 212, 0.35), transparent 70%); }
      .cube { position: absolute; width: 126px; height: 147px; }
      #beams { position: absolute; inset: 0; width: 1080px; height: 1920px; }

      /* ---------- scene 3 · neon city ---------- */
      #s3 { background: linear-gradient(180deg, rgba(26, 11, 61, 0.8) 0%, rgba(42, 15, 79, 0.72) 35%, rgba(18, 8, 42, 0.85) 70%, #07040f 100%); }
      #moon { position: absolute; left: 870px; top: 640px; width: 130px; height: 130px; border-radius: 50%;

      .sky { position: absolute; bottom: 0; }
      .bldg { position: absolute; bottom: 0; border-radius: 4px 4px 0 0; }
      #sign { position: absolute; left: 150px; right: 150px; top: 330px; height: 140px; border-radius: 26px; border: 6px solid #ff4fd8;
        display: flex; align-items: center; justify-content: center; background: rgba(20, 5, 40, 0.7);
        box-shadow: 0 0 40px rgba(255, 79, 216, 0.8), inset 0 0 30px rgba(255, 79, 216, 0.5); }
      #sign span { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 60px; letter-spacing: 0.04em; color: #fff;
        text-shadow: 0 0 12px #ff4fd8, 0 0 40px #ff4fd8, 0 0 80px #8b5cf6; }
      #stage { position: absolute; left: 180px; right: 180px; top: 1282px; height: 70px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(34, 230, 255, 0.55), rgba(34, 230, 255, 0.05) 70%); }
      #spot { position: absolute; left: 290px; top: 600px; width: 500px; height: 740px;

        clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
      .icon { position: absolute; top: 494px; width: 280px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px; }
      .icon .ring svg { width: 30px; height: 30px; }
      .icon .ring { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--cyan); display: flex; align-items: center; justify-content: center;
        background: rgba(8, 20, 40, 0.75); box-shadow: 0 0 30px rgba(34, 230, 255, 0.7); }
      .icon b { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 24px; letter-spacing: 0.12em; text-shadow: 0 0 18px var(--cyan); }
      .bub { position: absolute; font-family: "Inter", sans-serif; font-weight: 600; font-size: 36px; padding: 18px 26px; border-radius: 26px;
        background: rgba(255, 255, 255, 0.95); color: #12082a; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); white-space: nowrap; }

      /* ---------- scene 4 · ideas & community ---------- */
      #s4 { background: radial-gradient(ellipse 80% 60% at 50% 45%, rgba(74, 26, 72, 0.78) 0%, rgba(27, 13, 58, 0.72) 55%, rgba(10, 6, 24, 0.9) 100%); }
      #s4-rays { position: absolute; left: -460px; top: -40px; width: 2000px; height: 2000px; opacity: 0.25;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, 0.18) 0deg 6deg, transparent 6deg 18deg); }
      #qmark { position: absolute; left: 150px; top: 560px; width: 170px; height: 170px; border-radius: 50% 50% 50% 10%; background: #fff; color: #3a1a6b;
        display: flex; align-items: center; justify-content: center; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 130px; }
      #friend { position: absolute; left: 640px; top: 900px; width: 360px; height: 414px; }
      .say { position: absolute; display: flex; gap: 12px; padding: 20px 26px; border-radius: 28px; background: #fff; }
      .say i { display: block; width: 18px; height: 18px; border-radius: 50%; background: #3a1a6b; }
      #link { position: absolute; left: 470px; top: 1080px; width: 240px; height: 10px; border-radius: 5px; transform-origin: 0 50%;
        background: linear-gradient(90deg, #ff4fd8, var(--cyan)); box-shadow: 0 0 24px #ff4fd8; }
      .heart { position: absolute; width: 64px; height: 58px; filter: drop-shadow(0 0 14px #ff5d8f); }
      .crowd { position: absolute; width: 170px; height: 196px; opacity: 0.92; }
      .burst { position: absolute; width: 330px; height: 330px; }

      /* ---------- scene 5 · warp ---------- */
      #s5 { background: radial-gradient(circle at 50% 46%, #102a5c 0%, #060c24 45%, #020208 100%); }
      .wring { position: absolute; left: 540px; top: 990px; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%;
        border: 6px solid rgba(34, 230, 255, 0.8); box-shadow: 0 0 30px rgba(34, 230, 255, 0.6), inset 0 0 30px rgba(139, 92, 246, 0.6); }
      #speed { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .sign { position: absolute; left: 540px; top: 560px; width: 700px; margin-left: -350px; margin-top: -90px; text-align: center;
        font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 104px; letter-spacing: 0.01em; color: #fff; text-shadow: 0 0 30px var(--cyan); }
      #plat { position: absolute; left: 400px; top: 760px; width: 640px; height: 640px; }
      #plat-floor { position: absolute; left: 40px; top: 300px; width: 560px; height: 220px; border-radius: 50%;

      #you { position: absolute; left: 255px; top: 400px; width: 130px; height: 130px; border-radius: 50%; border: 6px dashed var(--gold);
        display: flex; align-items: center; justify-content: center; font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 40px; color: var(--gold);
        box-shadow: 0 0 40px rgba(255, 200, 61, 0.7); background: rgba(255, 200, 61, 0.12); }
      .pmini { position: absolute; }

      /* ---------- scene 6 · finale ---------- */
      #s6 { background: radial-gradient(circle at 50% 55%, rgba(27, 42, 107, 0.6) 0%, rgba(11, 15, 46, 0.55) 50%, rgba(3, 4, 9, 0.85) 100%); }
      #s6-rays { position: absolute; left: -460px; top: 120px; width: 2000px; height: 2000px; opacity: 0.35;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(34, 230, 255, 0.25) 0deg 5deg, transparent 5deg 15deg, rgba(139, 92, 246, 0.25) 15deg 20deg, transparent 20deg 30deg); }
      .conf { position: absolute; width: 18px; height: 30px; border-radius: 3px; }
      #biglogo { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #biglogo .word { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 84px; line-height: 0.95; text-align: center;
        background: linear-gradient(100deg, var(--white) 10%, var(--cyan) 55%, var(--violet) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #cta-btn { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.04em; padding: 26px 60px; border-radius: 999px;
        background: linear-gradient(100deg, var(--gold), #ffe08a); color: var(--ink); box-shadow: 0 0 60px rgba(255, 200, 61, 0.55); }
      #handle { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 44px; color: var(--cyan); }

      /* ---------- hero ---------- */
      #hero { position: absolute; left: 0; top: 0; width: 600px; height: 1050px; }
      #heroHop { position: absolute; inset: 0; }
      #heroSvg { position: absolute; inset: 0; width: 600px; height: 1050px; overflow: visible; }

      /* ---------- chrome ---------- */
      #logo { position: absolute; left: 0; right: 0; top: 96px; display: flex; align-items: center; justify-content: center; gap: 18px; }
      #logo .word { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 38px; letter-spacing: 0.02em;
        background: linear-gradient(100deg, var(--white) 10%, var(--cyan) 55%, var(--violet) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .head { position: absolute; left: 64px; right: 64px; top: 332px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; }
      .eyeclip { position: absolute; left: 0; right: 0; top: 256px; display: flex; justify-content: center; }
      .eyebrow { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cyan);
        padding: 8px 18px; border: 2px solid rgba(34, 230, 255, 0.45); border-radius: 999px; background: rgba(7, 10, 26, 0.6); }
      .display { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 66px; line-height: 1.08; text-transform: uppercase; letter-spacing: -0.01em;
        text-shadow: 0 5px 0 rgba(0, 0, 0, 0.45), 0 0 34px rgba(34, 230, 255, 0.3); }
      .display .w { display: inline-block; margin: 0 0.12em; }
      .accent { color: var(--cyan); }
      .gold { color: var(--gold); }
      #wipe { position: absolute; left: -400px; top: -500px; width: 1100px; height: 2900px; opacity: 0.0;
        background: linear-gradient(90deg, transparent, rgba(34, 230, 255, 0.95) 20%, #ffc83d 50%, rgba(255, 93, 143, 0.95) 80%, transparent); }
      #flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.9), rgba(34, 230, 255, 0.35) 30%, transparent 65%); }
      .cue { position: absolute; left: 72px; right: 72px; top: 1488px; display: flex; justify-content: center; }
      .cue span { display: block; max-width: 920px; text-align: center; font-family: "Inter", sans-serif; font-weight: 600; font-size: 42px; line-height: 1.25;
        color: #fff; padding: 12px 24px; border-radius: 16px; background: rgba(4, 5, 10, 0.78); }
    </style>
